<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
</head>
<body>
    <h1>Recuperar senha</h1>
    <form id="form-recuperar" action="index.html" method="get" onsubmit="alert('Senha enviada para o email informado')">
        <label for="recuperar-email">Email:</label>
        
        <input type="email" id="recuperar-email" title="O email precisa ser correspondente ao criado" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required><br><br>
        <button type="submit" id="btn-recuperar-enviar">Enviar</button>
    </form>
</body>
</html>
