<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do E-commerce</title>
</head>
<body>
    <h1>Login do Sistema</h1>
    <form id="form-login" action="produtos.html" method="get">
        <label for="login-usuario">Usuário:</label>
        <input type="text" id="login-usuario" name="usuario"><br><br>

        <label for="login-senha">Senha:</label>
        <input type="text" id="login-senha" name="senha"><br><br>

        <a id="link-novo-cadastro" href="cadastro.html">Novo</a>
        <a id="link-recuperar" href="recuperar_senha.html">Esqueceu a senha?</a><br><br>

        <button type="submit" id="btn-login-entrar">Entrar</button>
    </form>
</body>
</html>
