<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Compra</title>
</head>
<body>
    <header id="cabecalho-compra">
        <a id="link-compra-logo" href="produtos.html">
            <img id="img-compra-logo" src="https://via.placeholder.com/100x40?text=MINHA+LOGO" alt="Logotipo" width="100" height="40">
        </a>
        <nav style="display:inline; margin-left: 20px;">
            <a id="link-compra-sobre" href="sobre.html">Sobre</a> | 
            <a id="link-compra-sair" href="index.html">Sair</a>
        </nav>
        <span style="float: right;">
            <a id="link-compra-carrinho" href="finalizar_compra.html">
                <img id="img-compra-carrinho" src="https://via.placeholder.com/40?text=CARRINHO" alt="Carrinho" width="40" height="40">
            </a>
        </span>
    </header>
    <hr>

    <h2>Carrinho de Compras</h2>
    <table id="tabela-itens-compra" border="1" cellpadding="8">
        <caption>Resumo do Pedido</caption>
        <tr>
            <th>Item</th>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Subtotal</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Notebook Core i7</td>
            <td>1</td>
            <td>R$ 4.500,00</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Smartphone 128GB</td>
            <td>1</td>
            <td>R$ 1.500,00</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Mouse Sem Fio</td>
            <td>1</td>
            <td>R$ 100,00</td>
        </tr>
        <tr>
            <td colspan="3" align="right"><strong>Total:</strong></td>
            <td><strong>R$ 6.100,00</strong></td>
        </tr>
    </table>
    <br>

    <form id="form-concluir-compra" action="produtos.html" method="get" onsubmit="alert('Compra realizada com sucesso!');">
        <button type="submit" id="btn-finalizar-pedido">Finalizar Compra</button>
    </form>
</body>
</html>
